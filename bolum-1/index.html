<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8a5524">
<title>Atölye · 1. Tezgâh</title>
<style>
  @font-face { font-family: "Paytone One"; src: url("font/PaytoneOne-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "Baloo 2"; src: url("font/Baloo2.ttf") format("truetype"); font-weight: 400 800; font-display: block; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #6f4520; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 40%, #9a6430 0%, #6f4520 60%, #4d2f15 100%); }
  #sahne { position: relative; height: 100vh; height: 100dvh; width: min(100vw, calc(100dvh * 9 / 16)); overflow: hidden;
    box-shadow: 0 0 60px rgba(0,0,0,.45); background: #f2e6cc; touch-action: none; user-select: none; -webkit-user-select: none; }
  body.yatay #sahne { width: 100vw; box-shadow: none; }
  #sahne canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #acilis { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #f2e6cc; color: #1f1007; font-family: "Paytone One", sans-serif; font-size: 22px; transition: opacity .5s; }
  #acilis .cubuk { width: 180px; height: 14px; border: 4px solid #1f1007; border-radius: 10px; background: #fff9ea; overflow: hidden; }
  #acilis .dolu { height: 100%; width: 0%; background: #edad1a; transition: width .2s; }
  #acilis.git { opacity: 0; pointer-events: none; }
</style>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
</head>
<body>
<div id="sahne">
  <div id="acilis"><div>Atölye açılıyor</div><div class="cubuk"><div class="dolu" id="dolu"></div></div></div>
</div>
<script type="module" src="js/oyun.js"></script>
</body>
</html>
